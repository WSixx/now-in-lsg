changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: Features
      labels:
        - feat
        - enhancement
    - title: Bug Fixes
      labels:
        - fix
        - bug
    - title: Build & Dependencies
      labels:
        - build
        - dependencies
    - title: Maintenance
      labels:
        - chore
        - refactor
    - title: Other Changes
      labels:
        - "*"
