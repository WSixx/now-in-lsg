name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Run unit tests and build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Prepare release APK asset
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          SUFFIX=""
          if [[ "$APK_PATH" == *unsigned* ]]; then
            SUFFIX="-unsigned"
          fi
          cp "$APK_PATH" "now-in-lsg-${{ needs.release-please.outputs.tag_name }}${SUFFIX}.apk"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            now-in-lsg-${{ needs.release-please.outputs.tag_name }}*.apk \
            --clobber
